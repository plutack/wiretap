<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wiretap</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="stylesheet" href="./layout.css" />

    <!-- CodeMirror 5 (UMD global window.CodeMirror; loaded as classic scripts,
         not ES modules). Used by the script editor. -->
    <link rel="stylesheet" href="./vendor/codemirror/codemirror.css" />
    <script src="./vendor/codemirror/codemirror.js"></script>
    <script src="./vendor/codemirror/mode/javascript/javascript.js"></script>

    <!-- Import map: bare specifiers used by the vendored Preact + htm modules.
         Supported in WebKitGTK 2.41+ (the Wails webview). -->
    <script type="importmap">
      {
        "imports": {
          "preact": "./vendor/preact/preact.module.js",
          "preact/hooks": "./vendor/preact/hooks.module.js",
          "htm": "./vendor/htm/htm.module.js"
        }
      }
    </script>
  </head>
  <body class="h-full bg-neutral-950 text-neutral-200 font-sans [color-scheme:dark]">
    <div id="app" class="h-full"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
