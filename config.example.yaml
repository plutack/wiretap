# wiretap desktop configuration
#
# Create the active file with:
#   wiretap config init
#
# On Linux the default path is ~/.config/wiretap/config.yaml. Empty values use
# platform defaults. Paths may be absolute or relative to the process working
# directory; absolute paths are recommended for files outside the config dir.

relay:
  # WebSocket endpoint used by the desktop tunnel. Leave empty to disable relay
  # connectivity. This is a WSS URL, not the HTTPS base URL accepted by
  # `wiretap relay --url` administration commands.
  url: ""
  # Example: wss://relay.example.com/tunnel

  # JSON credentials written by `wiretap relay register --save`. Empty resolves
  # to relay-credentials.json in the wiretap config directory.
  creds_file: ""

store:
  # Local SQLite database containing captures, webhooks, cursors, and scripts.
  # Empty resolves to wiretap.db in the wiretap config directory.
  path: ""

tui:
  # Terminal UI color theme. The currently supported built-in theme is dark.
  theme: dark

intercept:
  # Local HTTP/HTTPS interception proxy. Keep this on a loopback address unless
  # you explicitly intend to expose the proxy to other machines.
  proxy_addr: 127.0.0.1:8888

  # Local HTTP control API serving /local/health, /local/captures, and
  # /local/webhooks. Keep this on loopback because captured data may be sensitive.
  local_api_addr: 127.0.0.1:9876

  # Child shell opened by `wiretap intercept start`. Empty auto-detects from
  # the environment. Accepted values: bash, fish, powershell, gitbash.
  shell: ""
