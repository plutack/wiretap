# Release pipeline. Runs only when a GitHub release is published — never on
# pushes or PRs. Produces:
#
#   - Linux GUI binaries (amd64 + arm64, tar.gz)
#   - Linux GUI AppImages (amd64 + arm64, single-file)
#   - Windows GUI binary (zip) + NSIS installer (exe), cross-compiled
#   - Arch Linux package (.pkg.tar.zst, built from the release source archive)
#   - wiretap-relay container image pushed to GHCR
#   - SHA256SUMS covering all of the above
#
# macOS is intentionally not built yet (needs a macOS runner; add a job when
# signing/notarization decisions are made).
#
# The Linux/Windows/Arch/AppImage artifacts all ship the same all-in-one
# binary: `wiretap` includes the CLI, TUI, and `wiretap gui` dashboard.

name: release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.26'

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -tags 'gui,production,gtk3' \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/wiretap ./cmd/wiretap
          cp README.md dist/
          cp packaging/linux/wiretap.desktop dist/
          tar -czf "wiretap_${VERSION}_linux_${{ matrix.arch }}.tar.gz" \
            -C dist wiretap README.md wiretap.desktop

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "wiretap_${VERSION}_linux_${{ matrix.arch }}.tar.gz" --clobber

  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-bin libfuse2

      - name: Build AppImage
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build tools
          CGO_ENABLED=1 go build -trimpath -tags 'gui,production,gtk3' \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o build/wiretap ./cmd/wiretap
          case "${APPIMAGE_ARCH:-x86_64}" in
            aarch64) TOOL='appimagetool-aarch64.AppImage' ;;
            *)       TOOL='appimagetool-x86_64.AppImage' ;;
          esac
          curl -fsSL -o "tools/appimagetool" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/${TOOL}"
          chmod +x tools/appimagetool

          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps \
                   AppDir/usr/share/icons/hicolor/512x512/apps
          install -m 0755 build/wiretap              AppDir/usr/bin/wiretap
          install -m 0644 packaging/linux/wiretap.desktop AppDir/wiretap.desktop
          install -m 0644 packaging/linux/wiretap.desktop AppDir/usr/share/applications/wiretap.desktop
          install -m 0755 packaging/appimage/AppRun  AppDir/AppRun
          rsvg-convert -w 256 -h 256 packaging/appimage/wiretap.svg -o AppDir/usr/share/icons/hicolor/256x256/apps/wiretap.png
          cp AppDir/usr/share/icons/hicolor/256x256/apps/wiretap.png AppDir/wiretap.png
          cp AppDir/usr/share/icons/hicolor/256x256/apps/wiretap.png AppDir/.DirIcon
          rsvg-convert -w 512 -h 512 packaging/appimage/wiretap.svg -o AppDir/usr/share/icons/hicolor/512x512/apps/wiretap.png || true

          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 ./tools/appimagetool --no-appstream \
            AppDir "dist/wiretap_${VERSION}_${APPIMAGE_ARCH:-x86_64}.AppImage"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH_NAME="${APPIMAGE_ARCH:-x86_64}"
          if [ ! -f "dist/wiretap_${VERSION}_${ARCH_NAME}.AppImage" ]; then
            echo "missing dist/wiretap_${VERSION}_${ARCH_NAME}.AppImage" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "dist/wiretap_${VERSION}_${ARCH_NAME}.AppImage" --clobber

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Wails v3 on Windows is CGO-free (webview2 via go-webview2 syscalls),
      # so the GUI binary cross-compiles from Linux directly.
      - name: Build wiretap.exe
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build
          CGO_ENABLED=0 GOOS=windows go build -trimpath -tags 'gui,production' \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o build/wiretap.exe ./cmd/wiretap
          (cd build && zip "../wiretap_${VERSION}_windows_x86_64.zip" wiretap.exe)

      - name: Build NSIS installer
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          VERSION="${GITHUB_REF_NAME#v}"
          # Microsoft's stable WebView2 evergreen bootstrapper permalink; the
          # installer runs it only when the runtime is missing on the target.
          curl -fsSL -o build/MicrosoftEdgeWebview2Setup.exe \
            "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          makensis -V2 -DVERSION="$VERSION" packaging/windows/installer.nsi
          mv "build/wiretap-${VERSION}-installer.exe" \
             "wiretap_${VERSION}_windows_x86_64-installer.exe"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "wiretap_${VERSION}_windows_x86_64.zip" \
            "wiretap_${VERSION}_windows_x86_64-installer.exe" --clobber

  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm base-devel git go gtk3 webkit2gtk-4.1 github-cli

      - uses: actions/checkout@v4

      # Build the official Arch package from packaging/arch/PKGBUILD; the
      # source is the release tag itself (makepkg clones and verifies it).
      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_DIR=/tmp/pkgbuild
          mkdir -p "$BUILD_DIR"
          cp "$GITHUB_WORKSPACE/packaging/arch/PKGBUILD" "$BUILD_DIR/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$BUILD_DIR/PKGBUILD"
          useradd -m builder
          chown -R builder "$BUILD_DIR"
          su builder -c "cd $BUILD_DIR && makepkg -f --noconfirm"
          # makepkg drops wiretap-<ver>-<rel>-x86_64.pkg.tar.zst wherever it
          # ran; glob both the build dir and builder's $HOME so we don't
          # depend on su's cwd-preservation behavior.
          PKG=$(find "$BUILD_DIR" /home/builder -maxdepth 2 -name 'wiretap-*-x86_64.pkg.tar.zst' -print -quit)
          if [ -z "$PKG" ]; then
            echo "makepkg did not produce a package" >&2
            exit 1
          fi
          mv "$PKG" "$GITHUB_WORKSPACE/wiretap-${VERSION}-x86_64.pkg.tar.zst"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "wiretap-${VERSION}-x86_64.pkg.tar.zst" --clobber

  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wiretap-relay" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

  checksums:
    needs: [linux, appimage, windows, arch]
    runs-on: ubuntu-latest
    steps:
      - name: Generate and attach SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Avoid `gh` (it shells out to `git` and breaks in a no-checkout
          # workspace); drive the GitHub REST API with `curl` directly.
          tag="${{ github.ref_name }}"
          api="https://api.github.com/repos/${{ github.repository }}/releases/tags/${tag}"
          mkdir -p dist
          curl -fsSL -H "Authorization: token ${GH_TOKEN}" \
            "${api}/assets" | \
            python3 -c 'import json,sys; [print(a["browser_download_url"]) for a in json.load(sys.stdin)]' \
            > urls.txt
          while read -r url; do
            [ -n "$url" ] || continue
            curl -fsSL -o "dist/$(basename "$url")" "$url"
          done < urls.txt
          ( cd dist && sha256sum ./* > ../SHA256SUMS )
          curl -fsSL -X POST -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @SHA256SUMS \
            "${api}/assets?name=SHA256SUMS"
